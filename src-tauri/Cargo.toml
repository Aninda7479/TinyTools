[package]
name = "tinytools"
version = "0.1.0"
edition = "2021"

[lib]
name = "tinytools_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
imageproc = "0.25"
qrcode = "0.14"
base64 = "0.22"
rayon = "1.10"
tempfile = "3"
kamadak-exif = "0.5"
lopdf = "0.44"
flate2 = "1"
rand = "0.8"
