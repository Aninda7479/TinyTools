name: Build & Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      bump_override:
        description: 'Manual version bump override'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
       github.actor != 'github-actions[bot]')
    outputs:
      new_version: ${{ steps.compute.outputs.new_version }}
      tag_name: ${{ steps.compute.outputs.tag_name }}
      bump_type: ${{ steps.compute.outputs.bump_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compute Next Version
        id: compute
        env:
          BUMP_OVERRIDE: ${{ inputs.bump_override || 'auto' }}
        run: node scripts/compute-next-version.cjs

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply version in working tree
        run: node scripts/apply-version.cjs ${{ needs.version.outputs.new_version }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "npx tauri"

      - name: Package Homelab Server Binary
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.new_version }}"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path target/release/tinytools.exe -DestinationPath target/release/tinytools-server-v${VERSION}-windows-x64.zip -Force"
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            tar -czf target/release/tinytools-server-v${VERSION}-linux-x64.tar.gz -C target/release tinytools
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            zip -j target/release/tinytools-server-v${VERSION}-macos-arm64.zip target/release/tinytools
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app
            target/release/bundle/**/*.sig
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.zip
            target/release/tinytools-server-v*.zip
            target/release/tinytools-server-v*.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply version in working tree
        run: node scripts/apply-version.cjs ${{ needs.version.outputs.new_version }}

      - name: Commit and Push Version Bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "chore(release): bump version to ${{ needs.version.outputs.new_version }} [skip ci]"
          git tag ${{ needs.version.outputs.tag_name }}
          git push origin release
          git push origin ${{ needs.version.outputs.tag_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Updater JSON
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
        run: node scripts/generate-updater-json.cjs

      - name: Generate Release Body
        run: |
          VERSION="${{ needs.version.outputs.new_version }}"
          cat <<EOF > body.md
          ### 🚀 Quick Download Links

          | OS / Platform | Direct Download Link | Description |
          | :--- | :--- | :--- |
          | 🪟 **Windows** | [Download Installer (MSI)](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/TinyTools_${VERSION}_x64_en-US.msi) <br> [Download Portable (EXE)](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/TinyTools_${VERSION}_x64-setup.exe) | Standard Windows x64 Installer or Portable EXE |
          | 🍎 **macOS** | [Download Apple Silicon (DMG)](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/TinyTools_${VERSION}_aarch64.dmg) | macOS Disk Image (Apple Silicon M1/M2/M3) |
          | 🐧 **Linux** | [Download AppImage](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/TinyTools_${VERSION}_amd64.AppImage) <br> [Download Debian Package (DEB)](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/TinyTools_${VERSION}_amd64.deb) | Portable AppImage or Ubuntu/Debian package |

          #### 🖥️ Server / Homelab (Headless --serve mode)
          *   🪟 Windows Server: [tinytools-server-v${VERSION}-windows-x64.zip](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/tinytools-server-v${VERSION}-windows-x64.zip)
          *   🍎 macOS Server: [tinytools-server-v${VERSION}-macos-arm64.zip](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/tinytools-server-v${VERSION}-macos-arm64.zip)
          *   🐧 Linux Server: [tinytools-server-v${VERSION}-linux-x64.tar.gz](https://github.com/Aninda7479/TinyTools/releases/download/v${VERSION}/tinytools-server-v${VERSION}-linux-x64.tar.gz)

          ---
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Release ${{ needs.version.outputs.tag_name }}
          draft: false
          prerelease: false
          body_path: body.md
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
