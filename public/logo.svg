<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24C8FA" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </radialGradient>

    <!-- Gear Gradient (Electric Cyan to Purple) -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>

    <!-- Left T-Bar Gradient (Cyan to Indigo) -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Right T-Bar Gradient (Purple to Pink) -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <!-- Center Line Gradient (Rust Orange to Coral) -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Cutout Mask for Gear Center -->
    <mask id="gearMask">
      <rect x="0" y="0" width="512" height="512" fill="white" />
      <circle cx="256" cy="256" r="115" fill="black" />
    </mask>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />

  <!-- Outer Gear Shape -->
  <g filter="url(#shadow)" fill="url(#gearGrad)" mask="url(#gearMask)">
    <!-- Base Ring -->
    <circle cx="256" cy="256" r="165" />
    <!-- 8 Rounded Teeth -->
    <rect x="221" y="36" width="70" height="440" rx="20" />
    <rect x="221" y="36" width="70" height="440" rx="20" transform="rotate(45 256 256)" />
    <rect x="221" y="36" width="70" height="440" rx="20" transform="rotate(90 256 256)" />
    <rect x="221" y="36" width="70" height="440" rx="20" transform="rotate(135 256 256)" />
  </g>

  <!-- Decorative Inner Ring -->
  <circle cx="256" cy="256" r="114" stroke="url(#gearGrad)" stroke-width="3" fill="none" opacity="0.3" />

  <!-- Stylized "T" Inner Icon (Composite) -->
  <g filter="url(#shadow)">
    <!-- Left Curve (Cyan/Blue) -->
    <path d="M 170 190 C 215 190, 242 205, 242 245 L 242 325" 
          stroke="url(#leftGrad)" stroke-width="20" stroke-linecap="round" fill="none" />

    <!-- Right Curve (Purple/Magenta) -->
    <path d="M 342 190 C 297 190, 270 205, 270 245 L 270 325" 
          stroke="url(#rightGrad)" stroke-width="20" stroke-linecap="round" fill="none" />

    <!-- Center Rust Core (Orange/Coral) -->
    <line x1="256" y1="180" x2="256" y2="330" 
          stroke="url(#rustGrad)" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
